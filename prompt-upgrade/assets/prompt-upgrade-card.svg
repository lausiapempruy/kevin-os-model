<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">prompt-upgrade — prompt improvement skill</title>
  <desc id="desc">An editorial graphic showing a rough prompt becoming a clearer, more actionable instruction.</desc>
  <rect width="1200" height="630" fill="#f4f1e8"/>
  <rect width="1200" height="18" fill="#ff5a36"/>
  <g fill="#171715" font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="82" font-size="20" font-weight="700" letter-spacing="4">KEVIN OS MODEL / SKILL 002</text>
    <path d="M76 108H1124" stroke="#171715" stroke-width="2" opacity=".24"/>
    <text x="76" y="218" font-size="88" font-weight="800" letter-spacing="-4">prompt-upgrade</text>
    <text x="80" y="270" font-size="26">Less guesswork. Clearer instructions. Fewer avoidable revisions.</text>
  </g>
  <g transform="translate(80 330)">
    <rect width="390" height="150" fill="#e7e1d4" stroke="#171715" stroke-width="2"/>
    <text x="24" y="36" fill="#56544f" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ROUGH PROMPT</text>
    <text x="24" y="83" fill="#171715" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">“Make it amazing.”</text>
    <text x="24" y="119" fill="#56544f" font-family="Arial, Helvetica, sans-serif" font-size="17">Goal unclear · scope open</text>
    <path d="M410 75H480M462 56L482 75L462 94" fill="none" stroke="#ff5a36" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
    <rect x="500" width="460" height="150" fill="#171715"/>
    <text x="526" y="36" fill="#ff5a36" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">UPGRADED PROMPT</text>
    <text x="526" y="78" fill="#f4f1e8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Goal · Requirements</text>
    <text x="526" y="111" fill="#f4f1e8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Constraints · Deliverables</text>
    <text x="526" y="134" fill="#c8c2b7" font-family="Arial, Helvetica, sans-serif" font-size="14">Only details relevant to the user's goal</text>
  </g>
  <g transform="translate(1000 330)">
    <rect width="120" height="150" fill="#ff5a36"/>
    <path d="M20 36H100M20 60H84M20 84H100M20 108H70" stroke="#171715" stroke-width="5"/>
  </g>
  <path d="M80 535H1120" stroke="#171715" stroke-width="2"/>
  <text x="80" y="575" fill="#56544f" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2">INTENT FIRST · FILTERED SUGGESTIONS · READY TO PASTE</text>
</svg>