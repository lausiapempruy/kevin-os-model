<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark sharp background -->
  <rect width="64" height="64" rx="4" fill="#0f172a"/>
  
  <!-- Browser / page frame -->
  <rect x="10" y="12" width="44" height="36" rx="2" fill="none" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Browser top bar -->
  <rect x="10" y="12" width="44" height="8" fill="#1e293b"/>
  <circle cx="16" cy="16" r="1.5" fill="#ef4444"/>
  <circle cx="21" cy="16" r="1.5" fill="#eab308"/>
  <circle cx="26" cy="16" r="1.5" fill="#22c55e"/>
  
  <!-- Fake generic content lines -->
  <rect x="16" y="26" width="28" height="3" rx="1" fill="#475569"/>
  <rect x="16" y="32" width="20" height="3" rx="1" fill="#475569"/>
  <rect x="16" y="38" width="24" height="3" rx="1" fill="#475569"/>
  
  <!-- Bold red prohibition slash -->
  <line x1="8" y1="56" x2="56" y2="8" stroke="#ef4444" stroke-width="5" stroke-linecap="square"/>
  
  <!-- Small accent square -->
  <rect x="48" y="48" width="8" height="8" fill="#4f46e5"/>
</svg>