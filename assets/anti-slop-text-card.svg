<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">anti-slop-text — writing quality skill</title>
  <desc id="desc">A warm paper and ink editorial graphic about writing with specificity, clarity, and a real voice.</desc>
  <rect width="1200" height="630" fill="#f4f1e8"/>
  <path d="M0 0H1200V18H0Z" fill="#ff5a36"/>
  <g fill="#171715">
    <text x="76" y="86" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="4">KEVIN OS MODEL / SKILL 001</text>
    <path d="M76 112H1124" stroke="#171715" stroke-width="2" opacity=".24"/>
    <text x="76" y="240" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="-4">anti-slop-text</text>
    <text x="80" y="300" font-family="Arial, Helvetica, sans-serif" font-size="28">Write with a point. Keep the human meaning.</text>
  </g>
  <g transform="translate(80 366)">
    <rect width="310" height="112" fill="#171715"/>
    <text x="24" y="39" fill="#f4f1e8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">01 / SPECIFIC</text>
    <text x="24" y="76" fill="#f4f1e8" font-family="Arial, Helvetica, sans-serif" font-size="22">Details over filler.</text>
    <rect x="326" width="310" height="112" fill="#e7e1d4" stroke="#171715" stroke-width="2"/>
    <text x="350" y="39" fill="#171715" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">02 / HONEST</text>
    <text x="350" y="76" fill="#171715" font-family="Arial, Helvetica, sans-serif" font-size="22">No invented facts.</text>
    <rect x="652" width="310" height="112" fill="#ff5a36"/>
    <text x="676" y="39" fill="#171715" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">03 / NATURAL</text>
    <text x="676" y="76" fill="#171715" font-family="Arial, Helvetica, sans-serif" font-size="22">Keep the real voice.</text>
  </g>
  <g transform="translate(1000 380)">
    <rect width="112" height="112" fill="none" stroke="#171715" stroke-width="2"/>
    <path d="M0 37H112M0 74H112M37 0V112M74 0V112" stroke="#171715" stroke-width="1" opacity=".24"/>
    <rect x="37" y="37" width="37" height="37" fill="#ff5a36"/>
  </g>
  <path d="M80 540H1120" stroke="#171715" stroke-width="2"/>
  <text x="80" y="580" fill="#56544f" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2">PORTABLE INSTRUCTIONS · OPEN SOURCE · NO DETECTOR GUARANTEES</text>
</svg>